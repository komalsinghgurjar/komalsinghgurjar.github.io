<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AHC Notice API Tester</title>
</head>
<body>
  <h2>AHC Notice API Tester</h2>

  <input id="email" type="email" placeholder="Firebase email">
  <br><br>

  <input id="password" type="password" placeholder="Password">
  <br><br>

  <button id="test">Sign in & Test API</button>

  <h3>Debug Output</h3>
  <pre id="output" style="white-space:pre-wrap;overflow-wrap:anywhere;"></pre>

  <script type="module">
    import { initializeApp } from
      "https://www.gstatic.com/firebasejs/13.2.0/firebase-app.js";

    import {
      getAuth,
      signInWithEmailAndPassword,
      getIdToken
    } from
      "https://www.gstatic.com/firebasejs/13.2.0/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCA8LujO_EwSz3sq9cRlNfDPdW2xXk22IU",
      authDomain: "ahc-kingshabh.firebaseapp.com",
      projectId: "ahc-kingshabh",
      storageBucket: "ahc-kingshabh.firebasestorage.app",
      messagingSenderId: "734428581634",
      appId: "1:734428581634:web:9baebf37a9402723f97c1b",
      measurementId: "G-34YZ37BQD8"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    const output = document.getElementById("output");
    const button = document.getElementById("test");

    button.onclick = async () => {
      output.textContent = "Starting...\n";
      button.disabled = true;

      try {
        const email = document.getElementById("email").value;
        const password = document.getElementById("password").value;

        output.textContent += "\n1. Signing in to Firebase...\n";

        const credential = await signInWithEmailAndPassword(
          auth, email, password
        );

        output.textContent += "Firebase authentication successful.\n";

        output.textContent += "\n2. Getting Firebase ID token...\n";

        const token = await getIdToken(credential.user, true);

        output.textContent += "Token obtained successfully.\n";
        output.textContent += "Token length: " + token.length + "\n";

        // RAW TOKEN FOR PYTHON DIAGNOSTICS
        output.textContent += "\n========== RAW FIREBASE ID TOKEN ==========\n";
        output.textContent += token;
        output.textContent += "\n========== END TOKEN ==========\n";

        output.textContent += "\n3. Calling Cloudflare Worker...\n";

        const url =
          "https://ahc-notice-api.komalsin9h.workers.dev/api/v1/content/access";

        const response = await fetch(url, {
          method: "GET",
          headers: {
            "Authorization": `Bearer ${token}`,
            "Accept": "application/json"
          }
        });

        output.textContent += "\n4. Worker response received.\n";
        output.textContent += "HTTP Status: " + response.status + "\n";
        output.textContent += "HTTP Status Text: " + response.statusText + "\n";

        const responseText = await response.text();

        output.textContent += "\n========== RAW API RESPONSE ==========\n";
        output.textContent += responseText;
        output.textContent += "\n========== END RESPONSE ==========\n";

        try {
          const json = JSON.parse(responseText);
          output.textContent += "\nParsed JSON:\n";
          output.textContent += JSON.stringify(json, null, 2);
        } catch {
          output.textContent += "\nResponse is not valid JSON.\n";
        }

      } catch (error) {
        output.textContent += "\n========== ERROR ==========\n";
        output.textContent += "Name: " + error.name + "\n";
        output.textContent += "Code: " + (error.code || "N/A") + "\n";
        output.textContent += "Message: " + error.message + "\n";
        output.textContent += "Stack: " + (error.stack || "N/A");
        output.textContent += "\n========== END ERROR ==========\n";

      } finally {
        button.disabled = false;
      }
    };
  </script>
</body>
</html>
