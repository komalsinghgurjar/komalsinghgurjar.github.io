
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AHC Notice API Tester</title>
</head>
<body>
  <h2>AHC Notice API Tester</h2>

  <input id="email" type="email" placeholder="Firebase email">
  <br><br>

  <input id="password" type="password" placeholder="Password">
  <br><br>

  <button id="test">Sign in & Test API</button>

  <pre id="output"></pre>

  <script type="module">
    import { initializeApp } from
      "https://www.gstatic.com/firebasejs/13.2.0/firebase-app.js";

    import {
      getAuth,
      signInWithEmailAndPassword,
      getIdToken
    } from
      "https://www.gstatic.com/firebasejs/13.2.0/firebase-auth.js";

    // For Firebase JS SDK v7.20.0 and later, measurementId is optional
const firebaseConfig = {
  apiKey: "AIzaSyCA8LujO_EwSz3sq9cRlNfDPdW2xXk22IU",
  authDomain: "ahc-kingshabh.firebaseapp.com",
  projectId: "ahc-kingshabh",
  storageBucket: "ahc-kingshabh.firebasestorage.app",
  messagingSenderId: "734428581634",
  appId: "1:734428581634:web:9baebf37a9402723f97c1b",
  measurementId: "G-34YZ37BQD8"
};

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    const output = document.getElementById("output");

    document.getElementById("test").onclick = async () => {
      output.textContent = "Signing in...";

      try {
        const email = document.getElementById("email").value;
        const password = document.getElementById("password").value;

        const credential = await signInWithEmailAndPassword(
          auth, email, password
        );

        const token = await getIdToken(credential.user, true);

        output.textContent = "Authentication successful.\n";
        output.textContent += "Calling Worker API...\n";

        const response = await fetch(
          "https://ahc-notice-api.komalsin9h.workers.dev/api/v1/content/access",
          {
            headers: {
              "Authorization": `Bearer ${token}`
            }
          }
        );

        const result = await response.json();

        output.textContent +=
          "\nHTTP Status: " + response.status +
          "\n\nAPI Response:\n" +
          JSON.stringify(result, null, 2);

        // Do not print or share the token.
      } catch (error) {
        output.textContent =
          "Error: " + error.code + "\n" + error.message;
      }
    };
  </script>
</body>
</html>
